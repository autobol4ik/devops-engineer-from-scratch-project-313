[project]
name = "hexlet-code"
version = "0.1.0"
description = "Учебное приложение для деплоя на PaaS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2,<4.0.0",
    "flask-cors>=6.0.5,<7.0.0",
    "gunicorn>=26.0.0,<27.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "sentry-sdk[flask]>=2.66.0,<3.0.0",
    "sqlalchemy>=2.0.51,<2.1.0",
    "sqlmodel>=0.0.39,<0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.15.22,<0.16.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
